<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!--
      Title + description are hardcoded here (not pulled from src/config.js)
      because index.html is read by browsers/crawlers before React ever runs.
      If you reuse this site for a different salon, update these two tags
      AND src/config.js so they stay in sync.
    -->
    <title>Cutie Paws Grooming | Dog Grooming in Riverside, CA</title>
    <meta
      name="description"
      content="Cutie Paws Grooming is a pet grooming salon on Van Buren Blvd in Riverside, CA. Breed cuts, pet clipping, paws grooming and home services. Call (951) 780-9495."
    />

    <!-- Preview only: keeps search engines from indexing the site. Remove
         this tag (and the X-Robots-Tag header in netlify.toml) at launch. -->
    <meta name="robots" content="noindex, nofollow" />

    <link rel="icon" type="image/svg+xml" href="/assets/logo.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600&family=Nunito:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
